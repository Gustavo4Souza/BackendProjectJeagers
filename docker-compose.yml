services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jeagers-api
    working_dir: /app
    volumes:
      - ./backend/api:/app
    environment:
      DATABASE_URL: postgresql+psycopg2://jeagers:jeagers@db:5432/jeagers
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: dev-secret-change-me
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      PYTHONUNBUFFERED: "1"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: jeagers-timescaledb
    environment:
      POSTGRES_DB: jeagers
      POSTGRES_USER: jeagers
      POSTGRES_PASSWORD: jeagers
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./backend/db/init-timescale.sql:/docker-entrypoint-initdb.d/init-timescale.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeagers -d jeagers"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jeagers-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescale_data:
  redis_data:
